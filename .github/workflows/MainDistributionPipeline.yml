# The DuckDB standard distribution pipeline: twelve platform builds, sqllogictests
# on each, and clang-tidy, which is itself a full build. That is release-grade and
# expensive, so it runs on main, on tags, and on demand, not on every PR push.
# PRs run ci.yml: one Linux build with every suite, plus the format check.
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['v*']
    # Twelve platform builds and a clang-tidy build are not worth running for a
    # documentation change.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: jev

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: jev
      format_checks: 'format;tidy'
